apiVersion: abinitio.io/v1
kind: CooperatingSystem
metadata:
  name: sample-cooperating-system
  namespace: abinitio-operator
  labels:
    app: abinitio-runtime
    environment: dev
spec:
  # CooperatingSystem configuration
  version: "4.0"

  # Resource requests and limits
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

  # Environment configuration
  environment:
    - name: AB_HOME
      value: "/opt/abinitio"
    - name: AB_AIR_ROOT
      value: "/opt/abinitio/air"

  # Storage configuration
  storage:
    dataDir: "/data"
    configDir: "/config"

  # Network configuration
  networking:
    serviceType: ClusterIP
    port: 8080
