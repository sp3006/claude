apiVersion: v1
kind: ConfigMap
metadata:
  name: abinitio-runtime-config
  namespace: bi-abi-apps-dev
  labels:
    app: abinitio-batch-service
data:
  runtime.yaml: |
    apiVersion: abinitio.io/v1
    kind: CooperatingSystem
    metadata:
      name: sample-cooperating-system
      namespace: abinitio-operator
      labels:
        app: abinitio-runtime
        environment: dev
    spec:
      version: "4.0"
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2000m"
          memory: "4Gi"
      environment:
        - name: AB_HOME
          value: "/opt/abinitio"
        - name: AB_AIR_ROOT
          value: "/opt/abinitio/air"
      storage:
        dataDir: "/data"
        configDir: "/config"
      networking:
        serviceType: ClusterIP
        port: 8080
