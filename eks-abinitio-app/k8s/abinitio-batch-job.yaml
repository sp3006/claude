apiVersion: batch/v1
kind: Job
metadata:
  name: abinitio-submit-job
  namespace: bi-abi-apps-dev
  labels:
    app: abinitio-batch-service
    operation: submit
    environment: dev
spec:
  # Job will retry up to 3 times on failure
  backoffLimit: 3

  # Remove completed jobs after 1 hour
  ttlSecondsAfterFinished: 3600

  # Max execution time: 2 hours
  activeDeadlineSeconds: 7200

  template:
    metadata:
      labels:
        app: abinitio-batch-service
        operation: submit
    spec:
      # Service account with IAM role for AWS access
      serviceAccountName: abinitio-batch-sa

      restartPolicy: OnFailure

      containers:
      - name: batch-service
        # Replace with your actual Nexus image
        # Example: nexus.your-domain.com:8082/docker-hosted/abinitio-batch-service:latest
        image: <NEXUS_REGISTRY>/<REPOSITORY>/abinitio-batch-service:latest
        imagePullPolicy: Always

        # Load environment from ConfigMap
        envFrom:
        - configMapRef:
            name: abinitio-app-config

        # Specific environment variables for this job
        env:
        - name: OPERATION
          value: "submit"
        - name: JOB_SPEC_PATH
          value: "/app/config/job_spec.yaml"

        # Database password from secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
              optional: false

        # Resource limits
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "4Gi"

        # Mount job specification from ConfigMap
        volumeMounts:
        - name: job-spec
          mountPath: /app/config
          readOnly: true

      # Volume definitions
      volumes:
      - name: job-spec
        configMap:
          name: abinitio-job-spec
