# Cancel Job - Cancels a running Ab Initio job
apiVersion: batch/v1
kind: Job
metadata:
  name: abinitio-cancel-job
  namespace: bi-abi-apps-dev
  labels:
    app: abinitio-batch-service
    operation: cancel
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      serviceAccountName: abinitio-batch-sa
      restartPolicy: OnFailure
      containers:
      - name: cancel-job
        image: <YOUR_ECR_REGISTRY>/abinitio-batch-service:latest
        envFrom:
        - configMapRef:
            name: abinitio-app-config
        env:
        - name: OPERATION
          value: "cancel"
        - name: JOB_NAME
          value: "<JOB_NAME_TO_CANCEL>"  # Replace with actual job name
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
